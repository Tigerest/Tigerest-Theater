name: reproduce-approved-rife-v233
on:
  workflow_dispatch:
permissions:
  contents: write
jobs:
  reproduce:
    runs-on: windows-latest
    timeout-minutes: 25
    strategy:
      fail-fast: false
      matrix:
        architecture: [sm75, sm80, sm86, sm89, sm90, sm100, sm120]
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v6
        with:
          python-version: '3.14.5'
          architecture: x64
      - name: Validate draft and original input
        env:
          GH_TOKEN: ${{ github.token }}
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $release = gh release view v2.3.3 --repo $env:GITHUB_REPOSITORY --json isDraft,targetCommitish | ConvertFrom-Json
          if (-not $release.isDraft -or $release.targetCommitish -ne '636798626b2775df32bc7213843cf454c1d1e4ea') { throw 'Unexpected release' }
          $tagSha = gh api "repos/$env:GITHUB_REPOSITORY/git/ref/tags/v2.3.3" --jq .object.sha
          if ($tagSha -ne $release.targetCommitish) { throw 'Unexpected tag' }
          gh release download v2.2.0 --repo $env:GITHUB_REPOSITORY --pattern Tigerest-RIFE-NVIDIA-1.0.0.zip --dir original
          if ($LASTEXITCODE -ne 0) { throw 'Original download failed' }
      - name: Reproduce and match approved package bytes
        shell: pwsh
        run: |
          python dev/windows/rife/reproduce_v233_release.py --architecture ${{ matrix.architecture }}
          if ($LASTEXITCODE -ne 0) { throw 'Package differs from approved catalog' }
      - name: Upload verified extension to draft
        env:
          GH_TOKEN: ${{ github.token }}
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $proof = Get-Content reproduction-proof.json -Raw | ConvertFrom-Json
          if (-not $proof.matchesApprovedCatalog) { throw 'Missing exact-match proof' }
          $release = gh api "repos/$env:GITHUB_REPOSITORY/releases/402231980" | ConvertFrom-Json
          if (-not $release.draft -or $release.tag_name -ne 'v2.3.3') { throw 'Unexpected release state' }
          $existing = @($release.assets | Where-Object name -eq $proof.name)
          if ($existing.Count -gt 0) {
            if ($existing.Count -ne 1 -or $existing[0].digest -ne ('sha256:' + $proof.sha256) -or $existing[0].size -ne $proof.size -or $existing[0].state -ne 'uploaded') { throw 'Existing asset differs' }
          } else {
            gh release upload v2.3.3 "reproduced/$($proof.name)" --repo $env:GITHUB_REPOSITORY
            if ($LASTEXITCODE -ne 0) { throw 'Extension upload failed' }
          }
      - uses: actions/upload-artifact@v4
        with:
          name: reproduction-proof-${{ matrix.architecture }}
          path: reproduction-proof.json
