name: publish-release

on:
  workflow_dispatch:
    inputs:
      tag:
        description: Existing draft release tag
        required: true
        type: string
      windows_run_id:
        description: Successful build or build-windows run ID
        required: true
        type: string
      macos_run_id:
        description: Optional successful build or build-macos run ID containing tigerest-theater-macos-arm64
        required: false
        default: ''
        type: string

permissions:
  actions: read
  contents: write

jobs:
  upload:
    runs-on: ubuntu-latest
    steps:
      - name: Validate inputs and draft release
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ inputs.tag }}
          WINDOWS_RUN_ID: ${{ inputs.windows_run_id }}
          MACOS_RUN_ID: ${{ inputs.macos_run_id }}
        run: |
          [[ "$RELEASE_TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+(-dev)?$ ]]
          [[ "$WINDOWS_RUN_ID" =~ ^[0-9]+$ ]]
          [[ -z "$MACOS_RUN_ID" || "$MACOS_RUN_ID" =~ ^[0-9]+$ ]]
          test "$(gh release view "$RELEASE_TAG" --repo "$GITHUB_REPOSITORY" --json isDraft --jq .isDraft)" = true
          RELEASE_SHA="$(gh api "repos/$GITHUB_REPOSITORY/commits/$RELEASE_TAG" --jq .sha)"
          RUNS=("$WINDOWS_RUN_ID:build-windows.yml")
          if [[ -n "$MACOS_RUN_ID" ]]; then RUNS+=("$MACOS_RUN_ID:build-macos.yml"); fi
          for PAIR in "${RUNS[@]}"; do
            RUN_ID="${PAIR%%:*}"
            WORKFLOW="${PAIR#*:}"
            RUN="$(gh api "repos/$GITHUB_REPOSITORY/actions/runs/$RUN_ID")"
            test "$(jq -r .conclusion <<< "$RUN")" = success
            test "$(jq -r .head_sha <<< "$RUN")" = "$RELEASE_SHA"
            # build.yml builds every platform through the same workflows.
            RUN_PATH="$(jq -r .path <<< "$RUN")"
            [[ "$RUN_PATH" == ".github/workflows/$WORKFLOW" || "$RUN_PATH" == .github/workflows/build.yml ]]
          done

      - name: Download successful build artifacts
        env:
          GH_TOKEN: ${{ github.token }}
          WINDOWS_RUN_ID: ${{ inputs.windows_run_id }}
          MACOS_RUN_ID: ${{ inputs.macos_run_id }}
        run: |
          mkdir release-assets
          gh run download "$WINDOWS_RUN_ID" --repo "$GITHUB_REPOSITORY" --name tigerest-theater-windows-x64-installer --dir release-assets
          gh run download "$WINDOWS_RUN_ID" --repo "$GITHUB_REPOSITORY" --name tigerest-theater-windows-x64-portable --dir release-assets
          if [[ -n "$MACOS_RUN_ID" ]]; then
            gh run download "$MACOS_RUN_ID" --repo "$GITHUB_REPOSITORY" --name tigerest-theater-macos-arm64 --dir release-assets
          fi

      - name: Verify names and generate checksums
        env:
          RELEASE_TAG: ${{ inputs.tag }}
          MACOS_RUN_ID: ${{ inputs.macos_run_id }}
        run: |
          VERSION="${RELEASE_TAG#v}"
          EXE="TigerestTheater-${VERSION}-x64.exe"
          ZIP="TigerestTheater-${VERSION}-x64.zip"
          DMG="TigerestTheater-${VERSION}-arm64.dmg"
          CHECKSUMS="TigerestTheater-${VERSION}-SHA256SUMS.txt"
          test -f "release-assets/$EXE"
          test -f "release-assets/$ZIP"
          FILES=("$EXE" "$ZIP")
          if [[ -n "$MACOS_RUN_ID" ]]; then
            test -f "release-assets/$DMG"
            FILES+=("$DMG")
          fi
          test "$(find release-assets -maxdepth 1 -type f | wc -l)" -eq "${#FILES[@]}"
          (
            cd release-assets
            sha256sum "${FILES[@]}" > "$CHECKSUMS"
          )
          {
            echo '### Release SHA-256'
            echo '```text'
            cat "release-assets/$CHECKSUMS"
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Upload assets to draft release
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ inputs.tag }}
        run: gh release upload "$RELEASE_TAG" release-assets/* --repo "$GITHUB_REPOSITORY" --clobber
