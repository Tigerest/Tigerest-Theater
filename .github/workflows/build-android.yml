name: build-android

on:
  workflow_call:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v7
    - uses: actions/setup-java@v5
      with:
        distribution: temurin
        java-version: '21'
    - name: Install pinned Android SDK packages
      run: |
        yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses > /dev/null
        "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" 'platforms;android-36' 'build-tools;36.0.0'
    - name: Stage pinned mpv-android runtime
      env:
        TIGEREST_ANDROID_DEPS: ${{ runner.temp }}/android-deps
      run: |
        # bootstrap.py rewrites the lock from what it extracted; it must still
        # equal the committed lock that verify_apk.py checks the APK against.
        git show HEAD:android/native-runtime.lock.json > "$RUNNER_TEMP/committed-lock.json"
        python3 - <<'PY'
        import json, os, sys
        sys.path.insert(0, 'android/tools')
        import bootstrap
        lock = json.loads(open('android/toolchain.lock.json', encoding='utf-8-sig').read())
        bootstrap.native_runtime(bootstrap.download('mpv.apk', lock['mpv.apk']))
        committed = json.load(open(os.path.join(os.environ['RUNNER_TEMP'], 'committed-lock.json')))
        if json.load(open('android/native-runtime.lock.json')) != committed:
            raise SystemExit('Extracted mpv-android runtime differs from native-runtime.lock.json')
        PY
        git checkout -- android/native-runtime.lock.json
    - name: Build APKs
      working-directory: android
      run: bash ./gradlew --console=plain assembleDebug assembleRelease
    - name: Verify packaged native libraries
      working-directory: android
      run: |
        python3 tools/verify_apk.py app/build/outputs/apk/debug/app-debug.apk
        python3 tools/verify_apk.py app/build/outputs/apk/release/app-release-unsigned.apk
    - name: Name APKs
      run: |
        VERSION=$(cat VERSION)
        mkdir -p dist
        cp android/app/build/outputs/apk/debug/app-debug.apk "dist/TigerestTheater-${VERSION}-android-debug.apk"
        cp android/app/build/outputs/apk/release/app-release-unsigned.apk "dist/TigerestTheater-${VERSION}-android-release-unsigned.apk"
    - name: Archive debug APK
      uses: actions/upload-artifact@v7
      with:
        name: tigerest-theater-android-debug
        path: dist/*-android-debug.apk
    - name: Archive unsigned release APK
      uses: actions/upload-artifact@v7
      with:
        name: tigerest-theater-android-release-unsigned
        path: dist/*-android-release-unsigned.apk
    - name: Run unit tests and lint
      working-directory: android
      run: bash ./gradlew --console=plain testDebugUnitTest lintDebug
