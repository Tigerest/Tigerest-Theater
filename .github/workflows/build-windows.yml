name: build-windows

env:
  # using older version due to severe memory leak
  # https://qt-project.atlassian.net/browse/QTBUG-141377
  QT_VERSION: "6.9.3"
  WEBENGINE_RUNTIME_TAG: "v2.0.17-dev"
  WEBENGINE_RUNTIME_SHA256: "5f91143e7d6e7146ebf73aa09297a26c5207edd1dcf1fb635953bb206184fb7a"

on:
  workflow_call:
  workflow_dispatch:
  push:
    branches:
      - master

jobs:
  build:
    # The first release build reads the runtime from its own unpublished draft.
    permissions:
      contents: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - artifact: windows-x64
            qt_arch: win64_msvc2022_64
            mpv_arch: x86_64-v3
            mpv_arch_fallback: x86_64
            vc_redist_arch: x64
            vcvars: vcvars64.bat
            machine: X64
          # ARM64 disabled - requires qt webengine builds
          # - artifact: windows-arm64
          #   qt_arch: win64_msvc2022_arm64
          #   mpv_arch: aarch64
          #   mpv_arch_fallback: ""
          #   vc_redist_arch: arm64
          #   vcvars: vcvarsamd64_arm64.bat
          #   machine: ARM64
    runs-on: windows-latest
    steps:
    - uses: actions/checkout@v7
      with:
        submodules: recursive
    - name: Install Qt 6
      uses: jurplel/install-qt-action@v4
      with:
        version: "${{ env.QT_VERSION }}"
        arch: "${{ matrix.qt_arch }}"
        modules: "qtwebengine qtwebchannel qtpositioning"
    - name: Install Inno Setup
      run: |
        choco install innosetup -y
      shell: powershell
    - name: Install verified D3D11 WebEngine runtime
      env:
        GH_TOKEN: ${{ github.token }}
      shell: pwsh
      run: |
        $ErrorActionPreference = 'Stop'
        New-Item -ItemType Directory -Path webengine-runtime | Out-Null
        gh release download $env:WEBENGINE_RUNTIME_TAG --repo $env:GITHUB_REPOSITORY --pattern TigerestWebEngine-6.9.3-d3d11.zip --dir webengine-runtime
        if ($LASTEXITCODE -ne 0) { throw 'Patched WebEngine download failed' }
        $archive = Join-Path $PWD 'webengine-runtime/TigerestWebEngine-6.9.3-d3d11.zip'
        if ((Get-FileHash -LiteralPath $archive -Algorithm SHA256).Hash.ToLowerInvariant() -ne $env:WEBENGINE_RUNTIME_SHA256) {
          throw 'Patched WebEngine archive checksum mismatch'
        }
        Expand-Archive -LiteralPath $archive -DestinationPath webengine-runtime
        "TIGEREST_WEBENGINE_RUNTIME=$($PWD.Path)/webengine-runtime" >> $env:GITHUB_ENV
    - name: Prepare release-pinned Windows TLS runtime
      shell: pwsh
      run: |
        python dev/windows/tls/prepare_openssl_runtime.py --output build/openssl-runtime
        if ($LASTEXITCODE -ne 0) { throw 'Verified OpenSSL runtime preparation failed' }
        "TIGEREST_OPENSSL_RUNTIME_DIR=$($PWD.Path)/build/openssl-runtime" >> $env:GITHUB_ENV
    - name: Prepare release-pinned RIFE playback kernels
      env:
        GH_TOKEN: ${{ github.token }}
      shell: pwsh
      run: |
        python dev/windows/rife/prepare_mpv_runtime.py --output build/rife-mpv-runtime
        if ($LASTEXITCODE -ne 0) { throw 'Verified mpv runtime preparation failed' }
        "TIGEREST_MPV_RUNTIME_DIR=$($PWD.Path)/build/rife-mpv-runtime" >> $env:GITHUB_ENV
    - name: Prepare pinned compile SDK and import library
      run: |
        python - <<'PY'
        import hashlib,json
        from pathlib import Path
        sdk=Path('dev/windows/mpv-sdk')
        for name,info in json.loads((sdk/'source.json').read_text())['files'].items():
            data=(sdk/'include/mpv'/name).read_bytes()
            assert len(data)==info['size'] and hashlib.sha256(data).hexdigest()==info['sha256'],name
        PY
        mkdir -p build/mpv/include/mpv build/mpv-fallback
        cp dev/windows/mpv-sdk/include/mpv/*.h build/mpv/include/mpv/
        cp build/rife-mpv-runtime/libmpv-2.dll build/mpv/
        cp build/rife-mpv-runtime/libmpv-fallback.dll build/mpv-fallback/libmpv-2.dll
        gendef build/mpv/libmpv-2.dll
        mv libmpv-2.def build/mpv/mpv.def
      shell: bash
    - name: Bundle VC runtime DLLs
      run: |
        mkdir deps
        mkdir deps/vcruntime
        # Dynamically locate VS installation on runner
        $vsPath = & "${env:ProgramFiles(x86)}\Microsoft Visual Studio\Installer\vswhere.exe" -latest -products * -property installationPath
        if (-not $vsPath) {
            $vsPath = (Get-ChildItem "C:\Program Files\Microsoft Visual Studio\*\*" | Where-Object { Test-Path "$_\VC\Redist\MSVC" } | Select-Object -First 1).FullName
        }
        # Runners also contain the legacy v142 CRT. Directory enumeration can
        # select it first; that runtime crashes the newer QtWebEngine at startup.
        $candidates = Get-ChildItem "$vsPath\VC\Redist\MSVC" -Recurse -Filter 'Microsoft.VC*.CRT' |
          Where-Object { $_.Parent.Name -eq '${{ matrix.vc_redist_arch }}' -and (Test-Path (Join-Path $_.FullName 'msvcp140.dll')) } |
          ForEach-Object {
            $info = (Get-Item (Join-Path $_.FullName 'msvcp140.dll')).VersionInfo
            [pscustomobject]@{ Directory = $_.FullName; Version = [version]::new($info.FileMajorPart, $info.FileMinorPart, $info.FileBuildPart, $info.FilePrivatePart) }
          }
        $vsRedist = $candidates | Sort-Object Version -Descending | Select-Object -First 1
        if (-not $vsRedist -or $vsRedist.Version -lt [version]'14.44.0.0') {
          throw 'QtWebEngine requires an MSVC runtime version 14.44 or newer'
        }
        Write-Host "Bundling MSVC runtime $($vsRedist.Version) from $($vsRedist.Directory)"
        Copy-Item "$($vsRedist.Directory)\*.dll" deps/vcruntime/
        # Also grab VCRedist installer for optional system-wide install
        Invoke-WebRequest -Uri "https://aka.ms/vs/17/release/vc_redist.x64.exe" -OutFile deps/vc_redist.x64.exe
      shell: powershell
    - name: Build
      run: |
        set "VS_PATH="
        for /f "tokens=*" %%i in ('"%ProgramFiles(x86)%\Microsoft Visual Studio\Installer\vswhere.exe" -latest -products * -property installationPath 2^>nul') do set "VS_PATH=%%i"
        if not defined VS_PATH (
            for /d %%d in ("C:\Program Files\Microsoft Visual Studio\*") do (
                for /d %%e in ("%%d\*") do (
                    if exist "%%e\VC\Auxiliary\Build\${{ matrix.vcvars }}" set "VS_PATH=%%e"
                )
            )
        )
        call "%VS_PATH%\VC\Auxiliary\Build\${{ matrix.vcvars }}"
        cd build
        set PATH=%PATH%;C:\Program Files (x86)\Inno Setup 6;%CD%
        set "QT_ROOT_DIR=%QT_ROOT_DIR:\=/%"
        set "BUILD_DIR_CMAKE=%CD:\=/%"
        cmake -GNinja -DCMAKE_BUILD_TYPE=RelWithDebInfo -DCMAKE_INSTALL_PREFIX=output -DQTROOT=%QT_ROOT_DIR% -DMPV_INCLUDE_DIR=mpv/include -DMPV_LIBRARY=mpv/libmpv-2.dll -DVCRUNTIME_DIR=%BUILD_DIR_CMAKE%/../deps/vcruntime -DVCREDIST_EXE=%BUILD_DIR_CMAKE%/../deps/vc_redist.x64.exe -DCHECK_FOR_UPDATES=ON -DUSE_STATIC_MPVQT=ON ..
        lib /def:mpv\mpv.def /out:mpv\libmpv-2.dll.lib /MACHINE:${{ matrix.machine }}
        ninja
        ninja windows_all
      shell: cmd
    - name: Run unit tests
      shell: pwsh
      run: |
        Get-Content dev/windows/TESTING.md | Out-Null
        . ./dev/windows/Enter-TestEnvironment.ps1
        ctest --test-dir build --output-on-failure
        if ($LASTEXITCODE -ne 0) { throw 'Windows tests failed' }
    - name: Verify packaged application startup
      run: node tests/smoke_windows_bundle.cjs "build/portable/Tigerest Theater.exe"
    - name: Verify packaged settings, file dialogs and Windows appearance
      shell: pwsh
      run: |
        $env:TEST_PYTHON = (Get-Command python).Source
        node tests/test_windows_web_controls.cjs "build/portable/Tigerest Theater.exe"
        if ($LASTEXITCODE -ne 0) { throw 'Packaged controls failed' }
    - name: Verify displayed packaged poster-wall pixels
      shell: pwsh
      run: |
        Get-Content dev/windows/TESTING.md | Out-Null
        . ./dev/windows/Enter-TestEnvironment.ps1
        node tests/test_windows_compositor.cjs "build/portable/Tigerest Theater.exe" --webengine --capture=build/tests/windows_compositor_capture.exe --output=build/compositor-packaged-test
        if ($LASTEXITCODE -ne 0) { throw 'Displayed compositor pixels failed; inspect captured evidence' }
    - name: Archive Windows compositor evidence
      if: always()
      uses: actions/upload-artifact@v7
      with:
        name: windows-compositor-evidence
        path: |
          build/compositor-native-test/
          build/compositor-packaged-test/
    - name: Archive installer
      uses: actions/upload-artifact@v7
      with:
        name: ${{ matrix.artifact }}-installer
        path: ${{ github.workspace }}/build/TigerestTheater-*.exe
    - name: Archive portable ZIP
      uses: actions/upload-artifact@v7
      with:
        name: ${{ matrix.artifact }}-portable
        path: ${{ github.workspace }}/build/TigerestTheater-*.zip
