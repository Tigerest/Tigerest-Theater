name: test

env:
  # The same Qt as the Windows release: the pages rely on Chromium features
  # (:has(), dynamic viewport units) that Ubuntu's Qt 6.4 WebEngine lacks.
  QT_VERSION: "6.9.3"

on:
  pull_request:
  push:
    branches:
      - main

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v7
      with:
        submodules: recursive

    - name: Install build dependencies from debian/control
      run: |
        sudo apt-get update
        sudo apt-get install --yes devscripts equivs ninja-build lcov xvfb xauth
        sudo mk-build-deps -i -r -t "apt-get --yes" debian/control
        # Runtime libraries the Qt online build loads under xvfb.
        sudo apt-get install --yes \
          libxcb-cursor0 libxkbcommon-x11-0 libxcb-icccm4 libxcb-image0 libxcb-keysyms1 \
          libxcb-randr0 libxcb-render-util0 libxcb-shape0 libxcb-xinerama0 libxcb-xkb1 \
          libnss3 libxcomposite1 libxdamage1 libxrandr2 libxtst6 libxkbfile1
        # mpv asks PipeWire for the audio devices first. Without PipeWire's
        # client.conf that fails at once and mpv stops the loop thread it has
        # just started; PipeWire 1.6 can miss a stop that early, and the test
        # then hangs until its timeout. With the configuration the attempt fails
        # later, at the connection, when the thread is already waiting for the
        # lock. The package ships the configuration; no daemon is started.
        sudo apt-get install --yes --no-install-recommends pipewire-bin
        test -f /usr/share/pipewire/client.conf

    # Ubuntu's Qt from debian/control stays installed but unused: CMake and the
    # tests use this Qt (QTROOT, PATH and LD_LIBRARY_PATH from the action).
    - name: Install Qt 6
      uses: jurplel/install-qt-action@v4
      with:
        version: "${{ env.QT_VERSION }}"
        modules: "qtwebengine qtwebchannel qtpositioning"

    - name: Configure
      run: cmake -B build -G Ninja -DCMAKE_BUILD_TYPE=Debug -DUSE_STATIC_MPVQT=ON -DCOVERAGE=ON -DQTROOT="$QT_ROOT_DIR" -DCMAKE_PREFIX_PATH="$QT_ROOT_DIR"

    - name: Build
      run: cmake --build build

    - name: Run tests
      run: |
        xvfb-run --auto-servernum --server-args="-screen 0 1920x1080x24" \
          ctest --test-dir build --output-on-failure

    # lcov 2.4 (Ubuntu 26.04) checks a tracefile for consistency and stops on a
    # lambda that is connected but never called: the enclosing function hits its
    # first line while the lambda itself is not hit, as in src/main.cpp. lcov
    # exempts lambdas by demangled name only, and these names are mangled.
    # Skipping the check keeps the numbers as gcov reports them; ignoring the
    # error instead would count those lambdas as hit.
    - name: Collect coverage
      run: |
        lcov --capture --directory build --output-file coverage.info \
          --ignore-errors mismatch
        lcov --remove coverage.info \
          '/usr/*' '*/Qt/*' '*/external/*' '*/tests/*' '*/build/*' \
          --output-file coverage.info \
          --ignore-errors unused \
          --rc check_data_consistency=0
        lcov --summary coverage.info --rc check_data_consistency=0 2>&1 | grep -v 'no data found' > coverage_summary.txt

    - name: Save PR number
      if: github.event_name == 'pull_request'
      run: echo "${{ github.event.pull_request.number }}" > pr_number.txt

    - name: Upload coverage artifact
      if: github.event_name == 'pull_request'
      uses: actions/upload-artifact@v7
      with:
        name: coverage
        path: |
          coverage_summary.txt
          pr_number.txt
