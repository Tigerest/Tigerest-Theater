name: test

env:
  # The same Qt as the Windows release: the pages rely on Chromium features
  # (:has(), dynamic viewport units) that Ubuntu's Qt 6.4 WebEngine lacks.
  QT_VERSION: "6.9.3"

on:
  pull_request:
  push:
    branches:
      - main

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v7
      with:
        submodules: recursive

    - name: Install build dependencies from debian/control
      run: |
        sudo apt-get update
        sudo apt-get install --yes devscripts equivs ninja-build lcov xvfb xauth
        sudo mk-build-deps -i -r -t "apt-get --yes" debian/control
        # Runtime libraries the Qt online build loads under xvfb.
        sudo apt-get install --yes \
          libxcb-cursor0 libxkbcommon-x11-0 libxcb-icccm4 libxcb-image0 libxcb-keysyms1 \
          libxcb-randr0 libxcb-render-util0 libxcb-shape0 libxcb-xinerama0 libxcb-xkb1 \
          libnss3 libxcomposite1 libxdamage1 libxrandr2 libxtst6 libxkbfile1

    # Ubuntu's Qt from debian/control stays installed but unused: CMake and the
    # tests use this Qt (QTROOT, PATH and LD_LIBRARY_PATH from the action).
    - name: Install Qt 6
      uses: jurplel/install-qt-action@v4
      with:
        version: "${{ env.QT_VERSION }}"
        modules: "qtwebengine qtwebchannel qtpositioning"

    - name: Configure
      run: cmake -B build -G Ninja -DCMAKE_BUILD_TYPE=Debug -DUSE_STATIC_MPVQT=ON -DCOVERAGE=ON -DQTROOT="$QT_ROOT_DIR" -DCMAKE_PREFIX_PATH="$QT_ROOT_DIR"

    - name: Build
      run: cmake --build build

    - name: Run tests
      run: |
        xvfb-run --auto-servernum --server-args="-screen 0 1920x1080x24" \
          ctest --test-dir build --output-on-failure

    - name: Collect coverage
      run: |
        lcov --capture --directory build --output-file coverage.info \
          --ignore-errors mismatch
        lcov --remove coverage.info \
          '/usr/*' '*/Qt/*' '*/external/*' '*/tests/*' '*/build/*' \
          --output-file coverage.info \
          --ignore-errors unused
        lcov --summary coverage.info 2>&1 | grep -v 'no data found' > coverage_summary.txt

    - name: Save PR number
      if: github.event_name == 'pull_request'
      run: echo "${{ github.event.pull_request.number }}" > pr_number.txt

    - name: Upload coverage artifact
      if: github.event_name == 'pull_request'
      uses: actions/upload-artifact@v7
      with:
        name: coverage
        path: |
          coverage_summary.txt
          pr_number.txt
