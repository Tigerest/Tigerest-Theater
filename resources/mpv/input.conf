# Tigerest Theater / 大河影院内置快捷键
# 以用户提供的 input.conf 为基线，仅增加返回媒体库的宿主保护键。

MBTN_RIGHT script-binding uosc/menu
# 左键双击由 Qt 宿主统一切换暂停；这里重复绑定会让同一次双击切换两次。
MBTN_LEFT_DBL ignore

UP add volume 5
DOWN add volume -5

d frame-back-step
D frame-back-step
f frame-step
F frame-step

x add speed -0.1
X add speed -0.1
c add speed 0.1
C add speed 0.1
z set speed 1.0
Z set speed 1.0

# Ctrl+J 常驻显示统计总览；显示后按 2 可进入完整帧处理耗时页。
Ctrl+j script-binding stats/display-stats-toggle
# 直接临时显示完整 Fresh/Redraw 帧处理流水线。
Ctrl+Shift+j script-binding stats/display-page-2

# Alt+1～3 只保留用户确认的三个画质档：默认、真人、激进测试。
Alt+1 script-binding profile_menu/apply-default
Alt+2 script-binding profile_menu/apply-liveaction
Alt+3 script-binding profile_menu/apply-aggressive-test

Alt+d cycle deband
Alt+i cycle interpolation

# 内嵌 libmpv 不应执行 quit 销毁播放核心；停止当前文件即返回 Emby。
ESC stop
q stop
Q stop
