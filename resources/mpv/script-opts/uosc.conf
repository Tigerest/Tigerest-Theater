# 这一行把时间轴显示样式设为细线风格，看起来更干净，也更适合高画质全屏观看。
timeline_style=line
# 这一行设置时间轴线条宽度为 2 像素，保证清晰但不过分抢眼。
timeline_line_width=2
# 这一行把展开后的时间轴高度设为 40 像素，拖拽和预览时更容易命中。
timeline_size=40
# 这一行不强制时间轴常驻，交由鼠标接近与交互状态控制显示。
timeline_persistency=
# 这一行为时间轴背景保留 1 像素上边界，让它和画面内容分层更清楚。
timeline_border=1
# 这一行把滚轮在时间轴上的默认跳转步长设为 5 秒，兼顾效率与精度。
timeline_step=5
# 这一行开启流媒体缓存指示，在线看视频时更容易判断缓冲状态。
timeline_cache=yes
# 这一行让流媒体热度图叠加在时间轴上方，尽量不挡住主时间线。
timeline_heatmap=overlay

# 这一行让精简进度条在窗口模式下常驻，可在不唤起完整控件时快速感知进度。
progress=windowed
# 这一行把精简进度条高度设为 2 像素，尽量减少对画面的侵入。
progress_size=2
# 这一行把精简进度条的线宽设为 20，提升小窗口下的可辨识度。
progress_line_width=20

# 这一行定义主控件栏内容；退出播放入口已移到左上角，避免与底部高频控制混在一起。
controls=menu,gap,<video,audio>subtitles,<has_many_audio>audio,<has_many_video>video,<has_many_edition>editions,<stream>stream-quality,button:filters,button:diagnostics,button:danmaku,button:danmaku_menu,cycle:toggle_on:show_danmaku@uosc_danmaku:on=toggle_on/off=toggle_off?弹幕开关,gap,space,<video,audio>speed,space,shuffle,loop-playlist,loop-file,gap,prev,items,next,gap,fullscreen
# 这一行把主控件按钮尺寸调到 32，兼顾高 DPI 可读性与画面占用。
controls_size=32
# 这一行为主控件增加外边距，避免按钮贴边显得拥挤。
controls_margin=8
# 这一行把按钮间距略微拉开，让整条控件栏更舒展。
controls_spacing=2
# 这一行不强制主控件常驻，仍然以悬停和交互唤出为主，避免遮挡画面。
controls_persistency=

# 这一行把音量条放在右侧，符合大多数播放器的直觉布局。
volume=right
# 这一行把音量条宽度调到 40，鼠标拖动时更容易命中。
volume_size=40
# 这一行为音量条保留 1 像素边界，和时间轴的视觉语言保持一致。
volume_border=1
# 这一行把音量滚动步长保持为 1，方便精细调整。
volume_step=1
# 这一行不强制音量条常驻，避免右侧区域长期占用画面空间。
volume_persistency=

# 这一行把倍速调节步长设为 0.1，兼顾精确和快速试错。
speed_step=0.1
# 这一行把倍速步长定义为绝对值而不是倍率因子，逻辑更直观。
speed_step_is_factor=no
# 这一行不强制倍速控件常驻，只有交互时再显示。
speed_persistency=

# 这一行把菜单项高度设为 36，中文条目和高 DPI 下更舒适。
menu_item_height=36
# 这一行把菜单最小宽度设为 260，兼顾中文菜单可读性与小窗口空间。
menu_min_width=260
# 这一行为菜单内容留出 4 像素内边距，让层次感更舒服。
menu_padding=4
# 这一行允许直接输入字符搜索菜单项目，查找字幕和音轨更方便。
menu_type_to_search=yes

# 这一行保留无边框顶栏模式，让 mpv.net 的窗口观感更现代。
top_bar=no-border
# 这一行把顶栏高度设为 40，在窗口模式下比较均衡。
top_bar_size=40
# 这一行让退出播放按钮位于左上角，点击后返回媒体库且不自动播放下一集。
top_bar_controls=left
# 这一行让顶栏显示标题，便于确认当前播放文件。
top_bar_title=yes
# 这一行不额外指定副标题模板，避免顶栏信息过载。
top_bar_alt_title=
# 这一行把副标题放在下方显示位，未来需要时不会和主标题冲突。
top_bar_alt_title_place=below
# 这一行让打开音频或视频文件时闪一下顶栏，方便感知载入反馈。
top_bar_flash_on=video,audio
# 这一行不强制顶栏常驻，仍然以轻量展示为主。
top_bar_persistency=

# 这一行为无边框窗口绘制 1 像素边框，方便分辨窗口边缘。
window_border_size=1

# 这一行关闭自动读取同目录下一个文件，避免看单个样片时自动串播。
autoload=no
# 这一行关闭随机播放按钮的默认激活状态，避免播放列表顺序被打乱。
shuffle=no

# 这一行保持窗口模式下 UI 基础缩放为 1，避免平时界面过大。
scale=1
# 这一行把全屏缩放提高到 1.2，全屏时按钮和文字会更易读。
scale_fullscreen=1.3
# 这一行保持字体基础缩放为 1，避免和系统高 DPI 缩放重复叠加。
font_scale=1
# 这一行为叠加在画面上的文字保留 1.2 的描边，提升复杂背景中的可读性。
text_border=1.2
# 这一行把圆角设为 4，让界面更接近用户现有 uosc 配置的观感。
border_radius=4
# 这一行暂不自定义主题色，继续沿用 uosc 默认配色。
color=
# 这一行暂不覆写透明度，让脚本自行维持相对平衡的层次关系。
opacity=
# 这一行不额外启用排序细化，保持用户原配置行为。
refine=
# 这一行把动画时间设为 100 毫秒，让控件响应更利落。
animation_duration=100
# 这一行把闪烁提示时长保持为 1000 毫秒，足够看清状态变化。
flash_duration=1000
# 这一行把接近触发阈值设为 40 像素，鼠标靠近控件时更容易唤出。
proximity_in=40
# 这一行把远离淡出阈值设为 120 像素，减轻轻微鼠标抖动造成的闪烁。
proximity_out=120
# 这一行不强制全局粗体，避免中文界面显得过粗过重。
font_bold=no
# 这一行把时间显示偏向“按当前倍速计算的剩余时长”，更符合日常使用。
destination_time=playtime-remaining
# 这一行不显示小数秒，让时间显示更整洁。
time_precision=0
# 这一行把缓冲时间提示阈值设为 60 秒，和用户原配置一致。
buffered_time_threshold=60
# 这一行不额外接管鼠标自动隐藏，保持用户原配置行为。
autohide=no
# 这一行使用短暂闪烁提示反馈暂停状态。
pause_indicator=flash

# 这一行定义清晰度菜单常见档位，便于流媒体源快速切档。
stream_quality_options=4320,2160,1440,1080,720,480,360,240,144

# 这一行定义视频类型列表，供文件浏览和自动识别时使用。
video_types=3g2,3gp,asf,avi,f4v,flv,h264,h265,m2ts,m4v,mkv,mov,mp4,mp4v,mpeg,mpg,ogm,ogv,rm,rmvb,ts,vob,webm,wmv,y4m
# 这一行定义音频类型列表，供文件浏览和自动识别时使用。
audio_types=aac,ac3,aiff,ape,au,cue,dsf,dts,flac,m4a,mid,midi,mka,mp3,mp4a,oga,ogg,opus,spx,tak,tta,wav,weba,wma,wv
# 这一行定义图片类型列表，供文件浏览和自动识别时使用。
image_types=apng,avif,bmp,gif,j2k,jp2,jfif,jpeg,jpg,jxl,mj2,png,svg,tga,tif,tiff,webp
# 这一行定义字幕类型列表，供字幕菜单与文件浏览时识别。
subtitle_types=aqt,ass,gsub,idx,jss,lrc,mks,pgs,pjs,psb,rt,sbv,slt,smi,sub,sup,srt,ssa,ssf,ttxt,txt,usf,vt,vtt
# 这一行定义播放列表类型列表，供打开和识别播放列表时使用。
playlist_types=m3u,m3u8,pls,url,cue
# 这一行规定目录浏览时默认加载视频、音频和图片，不自动扫入播放列表文件。
load_types=video,audio,image
# 这一行把默认打开目录保持为用户主目录，兼容 mpv.net 的常见使用习惯。
default_directory=~/
# 这一行在文件浏览时不显示隐藏文件，让列表更干净。
show_hidden_files=no
# 这一行关闭删除即进回收站的功能，避免误触删除。
use_trash=no
# 这一行让 uosc 根据控件可见性自动调整 OSD 边距，减少字幕和提示被挡住的概率。
adjust_osd_margins=yes

# 这一行保留片头片尾与广告章节的色带标记，做番剧导航时更方便。
chapter_ranges=openings:30abf964,endings:30abf964,ads:c54e4e80
# 匹配日文章节名中的片头与片尾标记。
chapter_range_patterns=openings:オープニング;endings:エンディング

# 这一行把语言优先级改成简中优先，再继承 mpv 的字幕语言，再回退英文。
languages=zh-hans,slang,en
# 这一行把在线字幕的默认保存目录放在配置目录下的 subtitles 文件夹。
subtitles_directory=~~/subtitles

# 这一行不禁用任何 uosc 元素，保留完整播放器界面。
disable_elements=
